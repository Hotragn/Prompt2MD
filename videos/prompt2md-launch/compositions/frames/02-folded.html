<script>
  (function () {
    var root = document.querySelector('[data-composition-id="02-folded"]');
    var DUR = 3.2;
    var DEG = Math.PI / 180;

    // ---- the paper fold (fold-recipe.md) ----
    // Split a face of size W x H into n strips of height h. Each strip is an overflow-hidden band
    // holding a copy of the face shifted up by k*h, so the flat strips tile it exactly.
    // Strips overlap their neighbour by 1px (same pixels at rest) so no crease seam opens mid-fold.
    function buildStrips(stage, source, n, h, W, H, look) {
      var strips = [];
      for (var k = 0; k < n; k++) {
        var strip = document.createElement("div");
        strip.className = "f02-strip";
        strip.style.width = W + "px";
        strip.style.height = (k < n - 1 ? h + 1 : h) + "px";

        var face = document.createElement("div");
        face.className = "f02-face";
        face.style.top = (-k * h) + "px";
        face.style.width = W + "px";
        face.style.height = H + "px";
        face.appendChild(k === 0 ? source : source.cloneNode(true));
        strip.appendChild(face);

        var shade = document.createElement("div");
        shade.className = "f02-shade";
        shade.style.background = k % 2 ? look.dark : look.lit;
        if (look.radius) {
          if (k === 0) shade.style.borderRadius = look.radius + "px " + look.radius + "px 0 0";
          if (k === n - 1) shade.style.borderRadius = "0 0 " + look.radius + "px " + look.radius + "px";
        }
        strip.appendChild(shade);

        var crease = null;
        if (k < n - 1) {
          crease = document.createElement("div");
          crease.className = "f02-crease";
          crease.style.top = (h - 1) + "px";
          strip.appendChild(crease);
        }

        stage.appendChild(strip);
        strips.push({ el: strip, shade: shade, crease: crease });
      }
      return strips;
    }

    // One proxy drives every strip; placed in onUpdate, so every seek is exact.
    function makePlacer(strips, h, fold) {
      return function () {
        var t = fold.a * 88;
        var c = Math.cos(t * DEG);
        var s = Math.sin(t * DEG);
        for (var k = 0; k < strips.length; k++) {
          gsap.set(strips[k].el, {
            y: k * h * c,
            z: k % 2 ? h * s : 0,
            rotationX: k % 2 ? -t : t,
          });
          gsap.set(strips[k].shade, { opacity: s });
          if (strips[k].crease) gsap.set(strips[k].crease, { opacity: s });
        }
      };
    }

    // the ink sheet: H = 1920, N = 8, h = 240 (dark-sheet shading)
    var SHEET_H = 240;
    var sheetStage = root.querySelector(".f02-sheet-stage");
    var sheetStrips = buildStrips(sheetStage, sheetStage.querySelector(".p2-sheet"), 8, SHEET_H, 1080, 1920, {
      lit: "rgba(255, 255, 255, 0.10)",
      dark: "rgba(0, 0, 0, 0.35)",
      radius: 0,
    });
    var sheetFold = { a: 0 };
    var placeSheet = makePlacer(sheetStrips, SHEET_H, sheetFold);
    placeSheet();

    // the Markdown card: H = 1016, N = 8, h = 127 (paper shading)
    var CARD_H = 127;
    var cardStage = root.querySelector(".f02-card-stage");
    var cardStrips = buildStrips(cardStage, cardStage.querySelector(".f02-paper"), 8, CARD_H, 908, 1016, {
      lit: "rgba(255, 255, 255, 0.35)",
      dark: "rgba(23, 21, 26, 0.20)",
      radius: 12,
    });
    var cardShadow = root.querySelector(".f02-card-shadow");
    var cardFold = { a: 1 };
    var placeCardStrips = makePlacer(cardStrips, CARD_H, cardFold);
    function placeCard() {
      placeCardStrips();
      gsap.set(cardShadow, { opacity: Math.pow(1 - cardFold.a, 3) });
    }
    placeCard();

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // ---- Scene 1 (0.00-0.70): the ink sheet folds upward from rest, the paper ground shows through ----
    tl.to(sheetFold, { a: 1, duration: 0.7, ease: "power2.inOut", onUpdate: placeSheet }, 0);
    // The folded stack is a thin band of 8 strip copies; it leaves as it goes edge-on,
    // so no stacked copies of the prompt linger over the paper.
    tl.to(sheetStage, { autoAlpha: 0, duration: 0.15, ease: "power1.in" }, 0.6);

    // ---- Scene 2 (0.20-1.02): five facets fly in from a depth cloud and lock (depth-scatter-assemble) ----
    var GOLDEN = Math.PI * (3 - Math.sqrt(5));
    var ROT_Z = [-32, 26, -18, 34, -28];
    var T_FACETS = 0.2;
    var STAGGER = 0.035;
    var ASSEMBLE = 0.7;
    var facets = root.querySelectorAll(".f02-facet");
    for (var f = 0; f < facets.length; f++) {
      var el = facets[f];
      var i = Number(el.getAttribute("data-order"));
      var ang = i * GOLDEN + 0.6;
      tl.fromTo(
        el,
        {
          x: 120 + Math.cos(ang) * 300,
          y: 40 + Math.sin(ang) * 190,
          z: 300 - (i / 4) * 600,
          rotationX: Math.sin(ang) * 60,
          rotationY: Math.cos(ang) * 60,
          rotation: ROT_Z[i],
          opacity: 0,
        },
        { x: 0, y: 0, z: 0, rotationX: 0, rotationY: 0, rotation: 0, opacity: 1, duration: ASSEMBLE, ease: "power3.out" },
        T_FACETS + i * STAGGER
      );
    }
    // the cloud turns a little while it collapses, and lands square (the finished badge is never rotated)
    tl.fromTo(
      root.querySelector(".f02-cloud"),
      { rotationY: -18 },
      { rotationY: 0, duration: 4 * STAGGER + ASSEMBLE, ease: "power2.out" },
      T_FACETS
    );
    // the violet badge square scales in behind the facets as they lock (spring-pop-entrance, smooth)
    tl.fromTo(
      root.querySelector(".f02-square"),
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.38
    );
    // the wordmark slides out from behind the badge through its clip window (techniques.md #12)
    tl.fromTo(
      root.querySelector(".f02-wm"),
      { xPercent: -112 },
      { xPercent: 0, duration: 0.46, ease: "power3.out" },
      0.56
    );

    // ---- Scene 3 (1.00-2.90): tagline, the card unfolds (Scene 1 in reverse), lines land on their words ----
    tl.fromTo(
      root.querySelector(".f02-tagline"),
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
      1.0
    );
    tl.fromTo(root.querySelector(".f02-card-wrap"), { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power1.out" }, 1.02);
    tl.fromTo(cardFold, { a: 1 }, { a: 0, duration: 0.7, ease: "power2.inOut", onUpdate: placeCard }, 1.02);

    // "## Goal" on "clean" (1.79); Requirements + six bullets on "Markdown" (1.99-2.44); Constraints, Notes by 2.6
    var LINE_AT = [1.79, 1.87, 1.99, 2.06, 2.135, 2.21, 2.285, 2.36, 2.435, 2.47, 2.51, 2.55, 2.59];
    var lines = root.querySelectorAll(".f02-ln");
    for (var j = 0; j < lines.length; j++) {
      tl.fromTo(
        lines[j],
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: j >= 9 ? 0.32 : 0.4, ease: "power3.out" },
        LINE_AT[j]
      );
    }

    // ---- Scene 4 (2.60-3.20): held read; the timeline spans the full frame ----
    tl.to({}, { duration: DUR }, 0);

    window.__timelines["02-folded"] = tl;
  })();
</script>
