  <script>
    (function () {
      var scope = document.querySelector('[data-composition-id="08-everywhere"]') || document;
      function one(c) { return scope.querySelector('[class~="' + c + '"]'); }
      function all(c) { return Array.prototype.slice.call(scope.querySelectorAll('[class~="' + c + '"]')); }

      var stage = one("08-everywhere-stage");
      var badge = one("08-everywhere-badge");
      var ringDraw = one("08-everywhere-ringdraw");
      var spike = one("08-everywhere-spike");
      var kickerText = one("08-everywhere-kicker-text");
      var chips = all("08-everywhere-chip");

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.00-0.90): "It plugs into"
      // Camera: a short push-in on the hub, settled before the frame's midpoint (back half stays still).
      tl.fromTo(stage, { scale: 0.95 }, { scale: 1, duration: 2.0, ease: "power2.out" }, 0);

      // orbit-3d-entry (entry form): the badge snaps in from depth with a quick 3D rotate that
      // decelerates and settles flat. It never rotates after it settles.
      tl.fromTo(
        badge,
        { rotationY: -78, rotationX: 22, z: -320, scale: 0.55 },
        { rotationY: 0, rotationX: 0, z: 0, scale: 1, duration: 0.7, ease: "expo.out" },
        0.04
      );
      tl.fromTo(badge, { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power1.out" }, 0.04);

      // Kicker at 0.1 s: the folded-corner glyph fades and scales 0.92 -> 1, the words follow.
      tl.fromTo(spike, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0.1);
      tl.fromTo(kickerText, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.14);

      // svg-path-draw: the dashed orbit ring draws clockwise from 12 o'clock (a solid mask stroke
      // reveals the dashed hairline, so the dash pattern survives the draw).
      var len = Math.ceil(2 * Math.PI * 324) + 2;
      ringDraw.style.strokeDasharray = len + " " + len;
      tl.fromTo(ringDraw, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.75, ease: "power2.out" }, 0.18);

      // Scene 2 (0.90-3.50): spring-pop-entrance (smooth, power3.out, no overshoot). Each chip
      // pops in place on its word cue, rising a short way out from the hub onto the ring.

        var at = Number(el.getAttribute("data-at"));
        var dx = Number(el.getAttribute("data-dx"));
        var dy = Number(el.getAttribute("data-dy"));
        var d = Math.sqrt(dx * dx + dy * dy) || 1;
        var ox = (-dx / d) * 30;
        var oy = (-dy / d) * 30;
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: ox, y: oy, scale: 0, opacity: 0 },
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          at
        );
      });

      // Scene 3 (3.50-4.00): the completed ring holds. No exit; the root transition is the exit.

      window.__timelines = window.__timelines || {};
      window.__timelines["08-everywhere"] = tl;
