  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const FID = "05-fit";
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const $ = (name) => document.getElementById(FID + "-" + name);
      const el = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls.split(" ").map((c) => FID + "-" + c).join(" ");
        if (text != null) e.textContent = text;
        return e;
      };

      // ---- the real document: `prompt2md compress incident.md -b 300` (verbatim) ----
      const SENT = "Extended narrative describing dashboards, hypotheses, and dead ends in detail.";
      const SRC = "c6199e0698ecc214";
      const OFF = [
        [32, 436], [438, 842], [844, 1248], [1250, 1654], [1656, 2060], [2062, 2466], [2468, 2872],
        [2874, 3278], [3280, 3684], [3686, 4090], [4092, 4499], [4501, 4908], [4910, 5317], [5319, 5726],
      ];
      const para = (n) =>
        "Update " + n + ": engineers investigated subsystem " + n + " and recorded observations. " +
        [SENT, SENT, SENT, SENT].join(" ") + " Key finding f-" + n + ".";
      const summary = (n) =>
        "Update " + n + ": engineers investigated subsystem " + n + " and recorded observations. […]";
      const anchor = (n) => "<!-- p2md:src=" + SRC + "#" + OFF[n][0] + "-" + OFF[n][1] + " -->";
      const RESOLUTION = "Resolution: root cause was a stale feature flag; fixed at 14:02 UTC.";

      // ---- geometry (px) ----
      const NFOLD = 8;      // paragraphs 0..7 fold in frame; 8 onward stay full (the sketch's landed state)
      const NSTRIP = 6;     // fold-recipe: N = 6 for a sheet under 1000 px
      const SH = 65;        // strip height: 390 / 6
      const BLOCK = 390;    // paragraph block: 14 pad + 9 lines x 40 + 16 pad
      const HP = 1 + BLOCK; // full row incl. hairline
      const HS = 143;       // summary row: 1 + 14 + 2 x 40 + 34 + 14
      const HR = 111;       // resolution row (2 lines)
      const DEG = Math.PI / 180;

      // ---- build the rows ----
      const list = $("list");
      const rows = [], strips = [], shades = [], wraps = [], sumTexts = [], anchors = [];
      for (let k = 0; k < 14; k++) {
        const row = el("div", "row");
        if (k < NFOLD) {
          const sum = el("div", "sum");
          const st = el("div", "sumtext", summary(k));
          const an = el("div", "anchor", anchor(k));
          sum.append(st, an);
          const wrap = el("div", "foldwrap");
          const stage = el("div", "stage");
          const ks = [], kh = [];
          for (let j = 0; j < NSTRIP; j++) {
            const strip = el("div", "strip");
            const copy = el("div", "copy", para(k));
            copy.style.top = -j * SH + "px";
            const shade = el("div", "shade " + (j % 2 ? "odd" : "even"));
            strip.append(copy, shade);
            stage.append(strip);
            ks.push(strip);
            kh.push(shade);
          }
          wrap.append(stage);
          row.append(sum, wrap);
          strips.push(ks);
          shades.push(kh);
          wraps.push(wrap);
          sumTexts.push(st);
          anchors.push(an);
        } else {
          row.append(el("div", "body", para(k)));
        }
        list.append(row);
        rows.push(row);
      }
      const last = el("div", "row");
      last.append(el("div", "body", RESOLUTION));
      list.append(last);
      rows.push(last);

      // ---- drivers (proxies; every onUpdate re-derives the whole layout, so seeks are exact) ----
      const fold = [];
      for (let k = 0; k < NFOLD; k++) fold.push({ a: 0 }); // 0 = flat, 1 = folded
      const scroll = { s: 0 };

      function placeStrips(k) {
        const t = fold[k].a * 88; // stop short of edge-on
        const c = Math.cos(t * DEG), s = Math.sin(t * DEG);
        strips[k].forEach((strip, j) => {
          gsap.set(strip, {
            y: j * SH * c,             // hinge chain
            z: j % 2 ? SH * s : 0,     // zigzag toward the viewer
            rotationX: j % 2 ? -t : t, // alternate mountain / valley
          });
          gsap.set(shades[k][j], { opacity: s }); // crease light rides the angle
        });
      }
      // A folding row's height follows the paper's bottom edge (z = 0, so exactly BLOCK * cos θ)
      // until it reaches the summary slot: the stack below tightens upward with the fold.
      function rowH(k) {
        if (k < NFOLD) return Math.max(HS, 1 + BLOCK * Math.cos(fold[k].a * 88 * DEG));
        return k < 14 ? HP : HR;
      }
      function layout() {
        let y = -scroll.s;
        for (let k = 0; k < rows.length; k++) {
          gsap.set(rows[k], { y: y });
          y += rowH(k);
        }
      }
      for (let k = 0; k < NFOLD; k++) placeStrips(k);
      layout();

      // ---- count proxy ----
      const countEl = $("count");
      const num = { v: 1449 };
      const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      const writeCount = () => {
        countEl.textContent = fmt(Math.round(num.v));
      };
      writeCount();

      // ================= Scene 1 (0.00–0.80) "Too long?" =================
      tl.fromTo($("card"), { y: 1150 }, { y: 0, duration: 0.8, ease: "power3.out" }, 0);
      tl.fromTo($("kicker"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
      // "1,449 tokens" lands centred above the sheet; it splits into the lockup on "under"
      gsap.set($("from"), { x: 5.27, xPercent: 50 });
      tl.fromTo($("from"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, 0.3);
      gsap.set($("tokens"), { x: 175 });
      tl.fromTo($("tokens"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.36);

      // ================= Scene 2 (0.80–2.40) "Fold fourteen hundred tokens" =================
      const T0 = 0.82, STAG = 0.12;
      for (let k = 0; k < NFOLD; k++) {
        const T = T0 + k * STAG;
        // the paper fold: 0.70 s, power2.inOut, one proxy per sheet
        tl.to(fold[k], {
          a: 1,
          duration: 0.7,
          ease: "power2.inOut",
          onUpdate: () => {
            placeStrips(k);
            layout();
          },
        }, T);
        // the summary line and its anchor arrive in the slot the paper uncovers (short path)
        tl.fromTo(sumTexts[k], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T + 0.42);
        tl.fromTo(anchors[k], { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, T + 0.48);
        // the folded band becomes the summary line
        tl.fromTo(wraps[k], { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, T + 0.52);
      }
      // the accumulated list climbs under the heading until it fits: summaries 5-7 over paragraph 8
      tl.to(scroll, { s: 5 * HS, duration: 0.9, ease: "power2.inOut", onUpdate: layout }, 1.5);

      // ================= Scene 3 (2.40–3.10) "under five hundred" =================
      // the figure splits: "1,449" steps left as the reference, the live count takes the right slot
      tl.fromTo($("from"), { x: 5.27, xPercent: 50 }, { x: 0, xPercent: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, 2.37);
      tl.fromTo($("tokens"), { x: 175 }, { x: 0, duration: 0.6, ease: "expo.out", immediateRender: false }, 2.37);
      tl.fromTo($("arrow"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 2.5);
      tl.fromTo(countEl, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 2.42);
      // counting-dynamic-scale: value and scale share timing + ease; lands on "hundred" (2.96)
      tl.fromTo(num, { v: 1449 }, { v: 475, duration: 0.54, ease: "power3.out", onUpdate: writeCount }, 2.42);
      tl.fromTo(countEl, { scale: 0.6 }, { scale: 1, duration: 0.54, ease: "power3.out" }, 2.42);
      tl.fromTo($("pct"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 3.0);

      // ================= Scene 4 (3.10–3.70) held read: nothing moves =================

      window.__timelines[FID] = tl;
    })();
  </script>
