<script>
  (function () {
    var FID = "06-cuts-vs-folds";
    function byId(name) {
      return document.getElementById(FID + "-" + name);
    }

    // ---- the shared page body: greeked text lines [y px within the 312px body, width %] ----
    var BARS = [
      [10, 100], [37, 94], [64, 58],
      [109, 100], [136, 97], [163, 71],
      [208, 100], [235, 91], [262, 46],
    ];
    var barsHTML = BARS.map(function (b) {
      return '<div class="' + FID + '-bar" style="top:' + b[0] + "px;width:" + b[1] + '%"></div>';
    }).join("");
    var fills = document.getElementsByClassName(FID + "-bars");
    for (var i = 0; i < fills.length; i++) fills[i].innerHTML = barsHTML;

    // ---- fold recipe geometry: N = 6 strips of h = H / N, each a shifted copy of the body ----
    var stage = byId("foldstage");
    var N = 6;
    var H = 312;
    var h = H / N; // 52px
    var strips = [];
    var shade = [];
    for (var k = 0; k < N; k++) {
      var s = document.createElement("div");
      s.className = FID + "-strip";
      s.id = FID + "-strip-" + k;
      s.innerHTML =
        '<div class="' + FID + '-bars" style="top:' + -k * h + 'px">' + barsHTML + "</div>" +
        '<div class="' + FID + "-shade " + FID + (k % 2 ? "-shade-odd" : "-shade-even") + '"></div>';
      stage.appendChild(s);
      strips.push(s);
      shade.push(s.lastChild);
    }

    // ---- fold recipe driver (exact): one proxy, strips placed from it on every update ----
    var fold = { a: 0 }; // 0 = flat, 1 = folded
    var DEG = Math.PI / 180;
    function placeStrips() {
      var t = fold.a * 88; // theta in degrees (stop short of edge-on)
      var c = Math.cos(t * DEG);
      var sn = Math.sin(t * DEG);
      strips.forEach(function (strip, j) {
        gsap.set(strip, {
          y: j * h * c, // hinge chain: each top edge sits on the previous bottom edge
          z: j % 2 ? h * sn : 0, // zigzag toward the viewer
          rotationX: j % 2 ? -t : t, // alternate mountain / valley
        });
        gsap.set(shade[j], { opacity: sn }); // crease light rides the angle
      });
    }
    placeStrips();

    var tl = gsap.timeline({ paused: true });

    // ---- Scene 1 (0.00-0.45): mirrored book-open tilts; top title slides down ----
    tl.fromTo(
      byId("top"),
      { y: -110, rotationX: -24, opacity: 0 },
      { y: 0, rotationX: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0
    );
    tl.fromTo(
      byId("bottom"),
      { y: 110, rotationX: 24, opacity: 0 },
      { y: 0, rotationX: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
      0.06
    );
    tl.fromTo(
      byId("title-top"),
      { y: -56, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      0.1
    );

    // ---- Scene 2 (0.45-1.40): "cut" 0.62, one fast stroke; the part below falls and greys by "hope" ----
    tl.fromTo(
      byId("cut"),
      { strokeDashoffset: 100 },
      { strokeDashoffset: 0, duration: 0.12, ease: "power2.out" },
      0.62
    );
    tl.fromTo(
      byId("drop"),
      { y: 0, rotation: 0 },
      { y: 170, rotation: 6, duration: 0.4, ease: "power2.in" },
      0.72
    );
    tl.fromTo(
      byId("drop"),
      { opacity: 1, filter: "grayscale(0)" },
      { opacity: 0.35, filter: "grayscale(1)", duration: 0.32, ease: "power1.out" },
      0.74
    );
    tl.fromTo(
      byId("badge-cut"),
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      1.1
    );

    // ---- Scene 3 (1.40-2.25): "This" 1.49 title lands; the page folds (fastest on "folds" 1.82) ----
    tl.fromTo(
      byId("title-bottom"),
      { y: 56, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
      1.49
    );
    tl.to(fold, { a: 1, duration: 0.7, ease: "power2.inOut", onUpdate: placeStrips }, 1.49);
    [0, 1, 2].forEach(function (n) {
      tl.fromTo(
        byId("anchor-" + n),
        { color: "#8B8794" },
        { color: "#5B3DF5", duration: 0.22, ease: "power2.out" },
        1.95 + n * 0.06
      );
    });
    tl.fromTo(
      byId("badge-fold"),
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
      2.0
    );

    // ---- Scene 4 (2.25-2.60): held read. Span the full frame duration. ----
    tl.to({}, { duration: 2.6 }, 0);

    window.__timelines = window.__timelines || {};
    window.__timelines["06-cuts-vs-folds"] = tl;
  })();
</script>
