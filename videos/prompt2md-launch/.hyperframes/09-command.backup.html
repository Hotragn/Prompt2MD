<style>
  /* Frame 09 · Command. Sketch units: 1cqw = 10.8px on the 1080x1920 stage. */
  #root {
    position: absolute;
    left: 0;
    top: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }
  /* full-bleed paper ground (a clip layer, never the root) */
  #f09-command-bg {
    position: absolute;
    inset: 0;
    background: #FAF9F6;
  }
  #f09-command-stage {
    position: absolute;
    inset: 0;
    container-type: size;
    overflow: hidden;
  }

  /* The 3D crane: 60-frame image sequence shown 1:1 (720px), centred where the sketch placed it
     (sketch box 16cqw / 14cqw / 68cqw, centre 540,518). Paper is baked in: no blend, border or shadow. */
  #f09-command-crane {
    position: absolute;
    left: 180px;
    top: 158px;
    width: 720px;
    height: 720px;
    z-index: 1;
    /* The baked paper sits one level off the ground (250,250,247 vs 250,249,246); feather the
       box so no square edge can survive encoding. Measured over all 60 frames, the crane keeps
       91/233/29/216 px clear (left/top/right/bottom), so these feathers never touch it. */
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 60px, #000 700px, transparent 720px),
      linear-gradient(to bottom, transparent 0, #000 140px, #000 580px, transparent 720px);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent 0, #000 60px, #000 700px, transparent 720px),
      linear-gradient(to bottom, transparent 0, #000 140px, #000 580px, transparent 720px);
    mask-composite: intersect;
  }
  .f09-command-cf {
    position: absolute;
    left: 0;
    top: 0;
    width: 720px;
    height: 720px;
    display: block;
    opacity: 0;
  }
  .f09-command-cf:first-child { opacity: 1; }

  /* centred rows (flex-centred, so GSAP owns the only transform on each animated piece) */
  .f09-command-row {
    position: absolute;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 2;
  }

  /* lockup: wordmark (Inter 700, "2md" in violet) */
  #f09-command-wmrow { top: 82cqw; }
  #f09-command-wordmark {
    position: relative;
    display: block;
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 11cqw;
    line-height: 1;
    letter-spacing: -0.035em;
    color: #17151A;
    white-space: nowrap;
    transform-origin: 50% 50%;
  }
  #f09-command-wordmark b { font-weight: 700; color: #5B3DF5; }
  /* hairline violet underline, swept left to right at 2.4s */
  #f09-command-rule {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 2.4cqw);
    height: 2px;
    background: #5B3DF5;
    transform-origin: 0% 50%;
  }

  /* tagline: fixed copy, EB Garamond italic, wide tracking, muted ink */

  /* terminal pill: navy surface, CLI palette */

<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    var DUR = 4.6;
    function el(id) { return document.getElementById(id); }

    // Scene 1 (0.00-0.70s): the crane rises in, then its 2.5s loop runs frame-locked to the last frame.
    var CRANE_T0 = 0; // entrance time = start of the image cycle
    var CRANE_FPS = 24;
    var CRANE_FRAMES = 60;
    var crane = el("f09-command-crane");
    var cf = crane.querySelectorAll(".f09-command-cf");
    tl.fromTo(crane, { opacity: 0, y: 56 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, CRANE_T0);
    // at t = t0 + j/24 show frame (j mod 60) and hide the one before: exactly one image visible at a time
    for (var j = 1; j < (DUR - CRANE_T0) * CRANE_FPS; j++) {
      var tj = CRANE_T0 + j / CRANE_FPS;
      tl.set(cf[j % CRANE_FRAMES], { opacity: 1 }, tj);
      tl.set(cf[(j - 1) % CRANE_FRAMES], { opacity: 0 }, tj);
    }

    // "Open" 0.00 / "source" 0.59: the lockup lands below the crane (spring-pop-entrance, smooth power3)
    tl.fromTo(el("f09-command-wordmark"), { scale: 0, opacity: 0, y: 24 }, { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);
    tl.fromTo(el("f09-command-tagline"), { scale: 0, opacity: 0, y: 24 }, { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.13);
    // the licence line fades in at the bottom of the stack on "source"
    tl.fromTo(el("f09-command-oss"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6);

    // Scene 2 (1.20-1.80s): "Try it at" 1.23, the terminal pill springs in and the command types 1.25-1.75
    tl.fromTo(el("f09-command-cmd"), { scale: 0, opacity: 0, y: 16 }, { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.23);
    // discrete-text-sequence: sparse whole-string states, instant jumps (keystroke clusters, a beat at the word break).
    // Each state span (in DOM order) shows from its t until the next state's t.
    var STATE_T = [0, 1.29, 1.32, 1.35, 1.41, 1.45, 1.48, 1.52, 1.56, 1.60, 1.64, 1.68, 1.72, 1.75];
    var states = el("f09-command-tw").querySelectorAll(".f09-command-state");
    for (var s = 1; s < STATE_T.length; s++) {
      tl.set(states[s], { opacity: 1 }, STATE_T[s]);
      tl.set(states[s - 1], { opacity: 0 }, STATE_T[s]);
    }
    // caret: solid while typing, then a square-wave blink (0.6s cycle) on the timeline through the last frame
    var T_DONE = STATE_T[STATE_T.length - 1];
    var HALF = 0.3;
    var caret = states[states.length - 1].querySelector(".f09-command-caret");
    for (var k = 1; T_DONE + k * HALF < DUR; k++) {
      tl.set(caret, { opacity: k % 2 ? 0 : 1 }, T_DONE + k * HALF);
