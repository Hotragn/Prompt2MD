<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="prompt2md icon">
  <title>prompt2md</title>
  <desc>An accordion fold seen edge-on — folding makes text smaller without removing anything from it. Its silhouette reads as M, for Markdown.</desc>
  <defs>
    <linearGradient id="p2md-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="0.55" stop-color="#6D5AF5"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="p2md-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#p2md-badge)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#p2md-sheen)"/>

  <!-- Front-facing planes of the fold: they catch the light. -->
  <path d="M18 44V24M32 38L46 24" fill="none" stroke="#FFFFFF" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Back-facing planes: they fall into shadow. The seam is the crease. -->
  <path d="M18 24L32 38M46 24V44" fill="none" stroke="#CFC3F5" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A Markdown Magic. -->
  <path d="M50 9 Q51.3 13.3 55.6 14.6 Q51.3 15.9 50 20.2 Q48.7 15.9 44.4 14.6 Q48.7 13.3 50 9 Z" fill="#FFE9C7"/>
</svg>
