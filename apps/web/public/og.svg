<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="prompt2md: A Markdown Magic">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="0.55" stop-color="#6D5AF5"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0B0A0C"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.035"/>

  <!-- mark -->
  <g transform="translate(84,74) scale(1.5)">
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#badge)"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.16"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="#0B0A0C" stroke-opacity="0.18"/>

  <!-- The fold, as one strip. Back planes first in solid lavender so the
       letterform survives at 16px; front planes second so their rounded ends
       overlap the creases, the way the front of a fold covers the back. -->
  <path d="M17 22L32 37M47 22V44" fill="none" stroke="#C7BCF2"
        stroke-width="8" stroke-linecap="round"/>
  <path d="M17 44V22M32 37L47 22" fill="none" stroke="#FFFFFF"
        stroke-width="8" stroke-linecap="round"/>
  </g>

  <text x="192" y="140" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="52" font-weight="750" letter-spacing="-1.4" fill="#F2EFEA">prompt<tspan fill="url(#word)">2md</tspan></text>
  <text x="195" y="176" font-family="ui-serif, 'Iowan Old Style', Palatino, Georgia, serif" font-style="italic" font-size="22" letter-spacing="2" fill="#9C96A8">A Markdown Magic</text>

  <!-- the claim -->
  <text x="84" y="292" font-family="ui-serif, 'Iowan Old Style', Palatino, Georgia, serif" font-style="italic" font-size="46" fill="#F2EFEA">Folding makes text smaller without</text>
  <text x="84" y="350" font-family="ui-serif, 'Iowan Old Style', Palatino, Georgia, serif" font-style="italic" font-size="46" fill="#F2EFEA">removing anything from it.</text>

  <text x="84" y="410" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" fill="#9C96A8">Token-optimized, layout-aware Markdown, and an honest report of what it saved.</text>

  <!-- The ledger. Real measured numbers from today's Daily Digest run, labelled
       as what they actually are: a SUMMARY of three live feeds, not lossless
       compression of the same content. The guarantee is that the raw payload is
       kept and retrievable byte-for-byte — never that the output retains
       everything. Those are different claims and must not be blurred. -->
  <g transform="translate(84,446)">
    <rect x="0" y="0" width="248" height="112" rx="14" fill="#1A1820" stroke="#272430"/>
    <text x="18" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="1.2" fill="#9C96A8">RAW FEEDS (JSON)</text>
    <text x="18" y="72" font-family="ui-monospace, Consolas, monospace" font-size="30" font-weight="700" fill="#F2EFEA">79,497</text>
    <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8A8496">three live sources</text>

    <rect x="268" y="0" width="248" height="112" rx="14" fill="#1A1820" stroke="#272430"/>
    <text x="286" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="1.2" fill="#9C96A8">DAILY DIGEST</text>
    <text x="286" y="72" font-family="ui-monospace, Consolas, monospace" font-size="30" font-weight="700" fill="#F2EFEA">1,363</text>
    <text x="286" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8A8496">selected + summarised</text>

    <rect x="536" y="0" width="330" height="112" rx="14" fill="#161B18" stroke="#2C4636"/>
    <text x="554" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="1.2" fill="#9C96A8">RAW PAYLOAD</text>
    <text x="554" y="72" font-family="ui-monospace, Consolas, monospace" font-size="26" font-weight="700" fill="#4ADE80">kept, byte-exact</text>
    <text x="554" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8A8496">recoverable via retrieve_original</text>
  </g>

  <text x="84" y="598" font-family="ui-monospace, Consolas, monospace" font-size="15.5" fill="#7C7688">A digest is a summary, not a shrink. The source is stored, never discarded. Every number reproducible.</text>
</svg>
