<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="prompt2md: A Markdown Magic">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#FAF9F6"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.02"/>

  <!-- mark -->
  <g transform="translate(84,74) scale(1.5)">
    <rect x="2" y="2" width="60" height="60" rx="15" fill="#5B3DF5"/>
    <g stroke="#5B3DF5" stroke-width="1.2" stroke-linejoin="round">
      <polygon points="20,44 26,36 40,36 46,44 33,50" fill="#FFFFFF"/>
      <polygon points="26,36 40,36 35,14" fill="#FFFFFF"/>
      <polygon points="20,44 26,36 16,19" fill="#FFFFFF"/>
      <polygon points="46,44 40,36 56,32" fill="#FFFFFF"/>
    </g>
    <polygon points="16,19 9,23 17,24" fill="#17151A"/>
  </g>

  <text x="192" y="140" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="52" font-weight="750" letter-spacing="-1.4" fill="#17151A">prompt<tspan fill="#5B3DF5">2md</tspan></text>
  <text x="195" y="176" font-family="ui-serif, 'Iowan Old Style', Palatino, Georgia, serif" font-style="italic" font-size="22" letter-spacing="2" fill="#5F5B66">A Markdown Magic</text>

  <!-- the claim -->
  <text x="84" y="292" font-family="ui-serif, 'Iowan Old Style', Palatino, Georgia, serif" font-style="italic" font-size="46" fill="#17151A">Folding makes text smaller without</text>
  <text x="84" y="350" font-family="ui-serif, 'Iowan Old Style', Palatino, Georgia, serif" font-style="italic" font-size="46" fill="#17151A">removing anything from it.</text>

  <text x="84" y="410" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" fill="#5F5B66">Token-optimized, layout-aware Markdown, and an honest report of what it saved.</text>

  <!-- The ledger. Real measured numbers from today's Daily Digest run, labelled
       as what they actually are: a SUMMARY of three live feeds, not lossless
       compression of the same content. The guarantee is that the raw payload is
       kept and retrievable byte-for-byte — never that the output retains
       everything. Those are different claims and must not be blurred. -->
  <g transform="translate(84,446)">
    <rect x="0" y="0" width="248" height="112" rx="14" fill="#FFFFFF" stroke="#E7E4DC"/>
    <text x="18" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="1.2" fill="#5F5B66">RAW FEEDS (JSON)</text>
    <text x="18" y="72" font-family="ui-monospace, Consolas, monospace" font-size="30" font-weight="700" fill="#17151A">79,497</text>
    <text x="18" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8B8794">three live sources</text>

    <rect x="268" y="0" width="248" height="112" rx="14" fill="#FFFFFF" stroke="#E7E4DC"/>
    <text x="286" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="1.2" fill="#5F5B66">DAILY DIGEST</text>
    <text x="286" y="72" font-family="ui-monospace, Consolas, monospace" font-size="30" font-weight="700" fill="#17151A">1,363</text>
    <text x="286" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8B8794">selected + summarised</text>

    <rect x="536" y="0" width="330" height="112" rx="14" fill="#F0FAF3" stroke="#BBE3C8"/>
    <text x="554" y="32" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" letter-spacing="1.2" fill="#5F5B66">RAW PAYLOAD</text>
    <text x="554" y="72" font-family="ui-monospace, Consolas, monospace" font-size="26" font-weight="700" fill="#15803D">kept, byte-exact</text>
    <text x="554" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#8B8794">recoverable via retrieve_original</text>
  </g>

  <text x="84" y="598" font-family="ui-monospace, Consolas, monospace" font-size="15.5" fill="#8B8794">A digest is a summary, not a shrink. The source is stored, never discarded. Every number reproducible.</text>
</svg>
