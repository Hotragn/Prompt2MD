<svg xmlns="http://www.w3.org/2000/svg" width="470" height="118" viewBox="0 0 470 118" role="img" aria-label="prompt2md — A Markdown Magic">
  <defs>
    <linearGradient id="p2md-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="0.55" stop-color="#6D5AF5"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="p2md-word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="p2md-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Warm ink backdrop so the lockup reads on light or dark pages. -->
  <rect x="0" y="0" width="470" height="118" rx="20" fill="#0B0A0C"/>

  <g transform="translate(16,19) scale(1.25)">
    <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#p2md-badge)"/>
    <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#p2md-sheen)"/>
    <path d="M18 44V24M32 38L46 24" fill="none" stroke="#FFFFFF" stroke-width="6.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 24L32 38M46 24V44" fill="none" stroke="#CFC3F5" stroke-width="6.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 9 Q51.3 13.3 55.6 14.6 Q51.3 15.9 50 20.2 Q48.7 15.9 44.4 14.6 Q48.7 13.3 50 9 Z" fill="#FFE9C7"/>
  </g>

  <text x="118" y="63" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1.2" fill="#F2EFEA">prompt<tspan fill="url(#p2md-word)">2md</tspan></text>
  <text x="121" y="92" font-family="ui-serif, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif"
        font-size="15" font-style="italic" letter-spacing="3.4" fill="#9C96A8">A Markdown Magic</text>
</svg>
