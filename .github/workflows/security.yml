name: Security Scan

# Whole-repo AI pentest, weekly and on demand -- NOT a pull request gate.
# It was one, and that was the wrong shape: Strix spends LLM budget per run, so
# sitting on `pull_request` meant paying to pentest Dependabot lockfile bumps.
# The blocking PR gate is now CodeQL (.github/workflows/codeql.yml), which is
# free and unlimited on public repos. This one runs deeper, on a schedule,
# where the spend is a deliberate choice rather than a tax on every push.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   STRIX_LLM     model id, e.g. openai/gpt-5.4
#   LLM_API_KEY   the provider key for that model
# ...and one repository variable (Settings -> Secrets and variables -> Actions
# -> Variables):
#   STRIX_INSTALLER_SHA256   sha256 of the vetted https://strix.ai/install script
# Without them this job fails at the preflight step rather than passing
# silently. Note that it has never once run past that step, so everything below
# it -- the installer URL, the flag set, the run.json shape -- is unverified
# against a real Strix release. Expect to fix something on the first green run.
#
# On the installer: this step used to be `curl -sSL https://strix.ai/install |
# bash`, which is remote code execution in a job that holds LLM_API_KEY and
# security-events: write. Whoever controls that domain, its DNS, or its CDN
# controls this runner. A security scanner is the last workflow that should
# take that trade, so the script is now downloaded, checksummed against a value
# a human vetted, and only then run. Pin the checksum by fetching the script,
# reading it, and recording `sha256sum` of what you approved -- re-vet on any
# upstream change, which is the point: the mismatch is the signal.

on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC, after the weekly CodeQL sweep
  workflow_dispatch:

jobs:
  strix-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history; the scan reads the whole tree

      # Fail closed, but say why. A security gate must not pass silently when
      # it is unconfigured, and a bare "strix: command failed" would send the
      # next person hunting through logs.
      - name: Preflight — required secrets and installer pin
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STRIX_INSTALLER_SHA256: ${{ vars.STRIX_INSTALLER_SHA256 }}
        run: |
          missing=""
          [ -z "$STRIX_LLM" ] && missing="$missing STRIX_LLM(secret)"
          [ -z "$LLM_API_KEY" ] && missing="$missing LLM_API_KEY(secret)"
          [ -z "$STRIX_INSTALLER_SHA256" ] && missing="$missing STRIX_INSTALLER_SHA256(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing" >&2
            echo "Add them under Settings -> Secrets and variables -> Actions." >&2
            echo "STRIX_LLM is a model id (e.g. openai/gpt-5.4); LLM_API_KEY is that provider's key." >&2
            echo "STRIX_INSTALLER_SHA256 is the sha256 of the installer script you vetted:" >&2
            echo "  curl -fsSL https://strix.ai/install -o s.sh && less s.sh && sha256sum s.sh" >&2
            echo "To turn this gate off instead, delete .github/workflows/security.yml." >&2
            exit 1
          fi

      # Download, verify, then run -- never pipe a remote script straight into a
      # shell. `set -euo pipefail` so a failed download cannot fall through to
      # executing a truncated or error-page file, and --proto '=https' so a
      # redirect cannot downgrade the transport.
      - name: Install Strix (checksum-verified)
        env:
          STRIX_INSTALLER_SHA256: ${{ vars.STRIX_INSTALLER_SHA256 }}
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 --max-time 120 \
            https://strix.ai/install -o "${RUNNER_TEMP}/strix-install.sh"
          echo "${STRIX_INSTALLER_SHA256}  ${RUNNER_TEMP}/strix-install.sh" | sha256sum -c -
          bash "${RUNNER_TEMP}/strix-install.sh"

      - name: Run security scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        # Exit 0 pass, 2 validated vulnerabilities (fails the job), 1 setup error.
        # Diff scoping goes away with the PR trigger: github.base_ref is empty
        # on a schedule, so --diff-base would have resolved to the string
        # "origin/". The scope flags are dropped rather than pointed at
        # something invented, leaving Strix its own default over -t.
        # Budget raised because whole-repo costs more than a diff. 25 is a
        # guess; the step below fails the job if the scan runs out, so tune it
        # from the first real run instead of trusting this number.
        run: |
          strix -n -t ./ \
            --scan-mode quick \
            --max-budget 25

      # A run that exhausts its budget wraps up early and can still exit 0 —
      # "no findings" would then mean "ran out of money", not "clean". run.json
      # records "stopped" rather than "completed" in that case, so assert it.
      # Not a complete guard (a run that wraps up on a budget *warning* still
      # records "completed" with partial coverage), so keep the budget generous.
      - name: Fail unless the scan completed
        if: always()
        run: |
          run_json=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
          if [ -z "$run_json" ]; then
            echo "No strix run.json found — the scan never produced a report." >&2
            exit 1
          fi
          status=$(jq -r .status "$run_json")
          cost=$(jq -r '.llm_usage.cost // 0' "$run_json")
          echo "status=$status cost=$cost (budget 25)"
          if [ "$status" != "completed" ]; then
            echo "Strix status '$status' — scan did not complete, likely budget exhausted. Raise --max-budget." >&2
            exit 1
          fi

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
