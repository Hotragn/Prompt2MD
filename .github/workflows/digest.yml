name: Daily Digest

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build pipeline packages
        run: pnpm --filter @prompt2md/core build && pnpm --filter @prompt2md/hermes-mcp build

      - name: Generate digest into the docs archive
        run: pnpm --filter @prompt2md/web digest:archive

      - name: Commit archive entry
        run: |
          git config user.name "prompt2md-digest[bot]"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/digests
          if git diff --cached --quiet; then
            echo "no new digest content — nothing to commit"
            exit 0
          fi
          git commit -m "chore(digest): daily archive entry [skip ci]"
          # main can move between checkout and push; rebase rather than fail
          # the scheduled run. Retry once, then surface the real error.
          git pull --rebase --autostash origin main || true
          git push || (git pull --rebase --autostash origin main && git push)
