name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. This was the only workflow without a permissions block, so
# it inherited the repository default for GITHUB_TOKEN -- which can be
# read/write -- while codeql, digest, health and security all declared their
# scopes. It runs on `pull_request`, and `pnpm install` executes dependency
# lifecycle scripts, so the token it hands them should be the smallest one that
# still works. Nothing here writes to the repository.
permissions:
  contents: read

env:
  # Telemetry writes a config file under the user profile on first run. CI has
  # no use for it, and touching the profile is pure risk on Windows runners.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `next build` walks os.homedir() on Windows and dies on the protected
      # "Application Data" junction inside the runner profile:
      #   glob error [EPERM: operation not permitted, scandir
      #   'C:\Users\runneradmin\Application Data']
      # Linux has no such junction, which is why only windows-latest failed.
      # Pointing the profile at an empty scratch directory makes any such scan
      # harmless. USERPROFILE is what os.homedir() reads on Windows and is
      # ignored on Linux, so this is safe to set unconditionally.
      # turbo resolves its global config from the profile, so the scratch home
      # needs the AppData layout Windows tools expect — otherwise the build
      # fails with "Global config path not found".
      - name: Prepare hermetic build home
        shell: bash
        run: mkdir -p "${{ runner.temp }}/build-home/AppData/Roaming" "${{ runner.temp }}/build-home/AppData/Local"

      - name: Build
        env:
          USERPROFILE: ${{ runner.temp }}/build-home
          APPDATA: ${{ runner.temp }}/build-home/AppData/Roaming
          LOCALAPPDATA: ${{ runner.temp }}/build-home/AppData/Local
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm test` includes the PDF layout suite, which reads real PDFs. The
      # repo stays text-only, so they are generated here — same recipe as the
      # docling job below. Without this the core tests die on ENOENT, and
      # because steps are sequential every gate after this one is skipped:
      # claims, installer, and both smoke tests stop running entirely.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate binary fixtures
        shell: bash
        run: |
          pip install reportlab pillow
          python fixtures/scripts/make_binary_fixtures.py

      - name: Test (golden corpus + unit + MCP integration + CLI)
        run: pnpm test

      - name: Validate skill definition
        run: pnpm --filter prompt2md-skill lint

      # Numbers the project states about itself, re-derived from reality.
      # Catches stale counts and any "N% lossless" claim, which conflates
      # reduction with recoverability.
      - name: Verify stated claims
        run: pnpm check:claims

      - name: Installer check (sandboxed HOME, real configs untouched)
        run: pnpm test:install

      - name: MCP stdio smoke test (built binary, real transport)
        run: node packages/hermes-mcp/scripts/verify-stdio.mjs

      - name: CLI smoke test (built binary, zero sidecars)
        run: node packages/cli/dist/index.js convert --text "smoke test input for ci" --json

  # The high-fidelity path against a REAL docling-serve. Everything else about
  # docling is stubbed, which proves the routing and nothing about the engine.
  # Scans and complex tables are the headline capability, so it gets one job
  # that runs the actual thing.
  docling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The repo stays text-only; real PDFs are generated on demand.
      - name: Generate binary fixtures
        run: |
          pip install reportlab pillow
          python fixtures/scripts/make_binary_fixtures.py

      # markitdown[pdf] is required for the fast path to read PDFs at all —
      # without it PdfConverter raises MissingDependencyException.
      - name: Install the fast-path sidecar
        run: pip install "markitdown[pdf]"

      - name: Start docling-serve
        run: |
          docker run -d --name docling -p 5001:5001 \
            quay.io/docling-project/docling-serve
          echo "waiting for docling-serve to accept requests…"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5001/health > /dev/null 2>&1; then
              echo "ready after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "docling-serve did not become ready"; docker logs docling | tail -40; exit 1

      - name: High-fidelity integration test
        env:
          P2MD_DOCLING_URL: http://localhost:5001
        run: pnpm --filter @prompt2md/core test -- docling

      - name: docling-serve logs
        if: always()
        run: docker logs docling | tail -60

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Selenium E2E (studio in headless Chrome)
        run: pnpm --filter @prompt2md/web test:e2e
