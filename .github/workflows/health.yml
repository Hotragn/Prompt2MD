name: Production Health

# A red run here is the alert: GitHub emails the maintainer on scheduled
# workflow failures, so the live product breaking reaches us before a user
# files the issue. Probes the deployments the way a user arrives at them —
# landing page, capabilities, a real conversion round-trip, the input guard,
# and the docs site.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (odd minute to avoid the cron rush)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # No install: the probe is dependency-free by design, so this job stays
      # cheap enough to run every 6 hours forever.
      - name: Probe the live product
        run: node scripts/health-check.mjs
